{% extends "admin/index.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    #content {
        max-width: 1400px;
        margin: 0 auto;
    }
    
    .dashboard .module {
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }
    
    .dashboard .module caption {
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        padding: 12px 16px;
        font-weight: 600;
    }
    
    .dashboard .module table {
        border-radius: 0;
    }
    
    .dashboard .module th {
        background: #f9fafb;
    }
    
    /* Custom card styling for app list */
    .dashboard #content-main .module {
        background: white;
    }
    
    .dashboard .module p {
        padding: 12px 16px;
    }
    
    /* Welcome message styling */
    .welcome-message {
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid #bbf7d0;
    }
    
    .welcome-message h2 {
        color: #166534;
        margin: 0 0 8px 0;
        font-size: 1.25rem;
    }
    
    .welcome-message p {
        color: #14532d;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="welcome-message">
    <h2>Welcome to HICMS Admin Dashboard</h2>
    <p>Manage facilities, inspections, users, and system settings from this centralized interface.</p>
</div>
{{ block.super }}
{% endblock %}
